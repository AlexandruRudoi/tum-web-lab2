name: CI - Build Check

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Verify dist output
        run: |
          test -f dist/index.html || (echo "Build failed: dist/index.html missing" && exit 1)
          test -f dist/admin/index.html || (echo "Build failed: dist/admin/index.html missing" && exit 1)
          echo "Build OK"
