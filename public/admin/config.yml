  # ----------------------------------------------------------------
  # Services – per locale
  # ----------------------------------------------------------------
  - name: services_en
    label: "Services (EN)"
    folder: src/content/services/en
    create: true
    delete: true
    format: json
    slug: "{{slug}}"
    fields:
      - { name: title,       label: Title,       widget: string }
      - { name: description, label: Description, widget: text   }
      - { name: order,       label: Sort Order,  widget: number, value_type: int, default: 99 }

  - name: services_ro
